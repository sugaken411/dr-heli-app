<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>統括・業務管理コンソール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #f2f2f7; --ink: #1c1c1e; --sub: #8e8e93; --blue: #007aff; --brand: #d32f2f; --line: rgba(60,60,67,0.12); }
    body { font-family: -apple-system, sans-serif; background-color: var(--bg); color: var(--ink); margin: 0; padding: 0; padding-top: env(safe-area-inset-top); }
    
    header { position: sticky; top: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; z-index: 100; } /* 🌟 gap: 「◀ ポータル」と題名がくっついて「ポータル統括・業務管理」と読めていた */
    .hdr-btn { color: var(--blue); background: none; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
    /* 🌟 現場基準（A3）：ヘッダーボタンも手袋・揺れる機内で確実に押せるよう、見た目と配置は変えずにタップ領域だけを広げる。
       高さは44pxを確保し、横幅は透明な当たり判定(::after)を左右6pxずつ（隣のボタンとの隙間の半分）伸ばす。
       横幅そのものを44pxにするとタイトルが「…」で省略されてしまうため採用しない */
    .hdr-btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; position: relative; }
    .hdr-btn::after { content: ''; position: absolute; top: 0; bottom: 0; left: -6px; right: -6px; }
    
    #global-loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(0,122,255,0.2); border-top: 4px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .progress-bar-track { width: 200px; height: 6px; background: rgba(0,122,255,0.15); border-radius: 3px; overflow: hidden; margin-bottom: 16px; position: relative; }
    .progress-bar-fill { position: absolute; top: 0; left: -40%; height: 100%; width: 40%; background: var(--blue); border-radius: 3px; animation: indeterminate 1.1s ease-in-out infinite; }
    @keyframes indeterminate { 0% { left: -40%; } 100% { left: 100%; } }
    
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .cal-header { text-align: center; font-size: 12px; font-weight: 800; color: var(--sub); padding: 8px 0; }
    .cal-cell { background: #fff; min-height: 100px; border-radius: 8px; padding: 6px; border: 1px solid var(--line); display: flex; flex-direction: column; cursor: pointer; transition: 0.15s; }
    .cal-cell:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(0,122,255,0.15); }
    .cal-cell.empty { background: transparent; border: none; cursor: default; }
    .cal-date { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
    .cal-staff { font-size: 10px; color: var(--sub); font-weight: bold; line-height: 1.2; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-badge { font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #fff; margin-bottom: 2px; }
    .cal-reason { font-size: 10px; color: var(--brand); font-weight: bold; background: #ffebeb; padding: 2px 4px; border-radius: 4px; display: inline-block; margin-top: auto; }
    
    /* 🖨️ 印刷用スタイル */
    @media print {
      body { background: #fff; margin: 0; padding: 0; -webkit-print-color-adjust: exact; }
      header, .no-print { display: none !important; }
      main { max-width: 100%; padding: 0; margin-top: 10px; }
      .cal-cell { border: 1px solid #ccc; break-inside: avoid; min-height: 80px; }
      .bg-white { border: none !important; box-shadow: none !important; }
      .break-after { page-break-after: always; }
      #view-list { display: block !important; }
      body.staff-mode #view-list, body.staff-mode #view-cal, body.staff-mode #activity-box { display: none !important; }
    }
    .staff-input { min-height: 44px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; padding: 0 8px; font-weight: 700; }
    @media (max-width: 400px) {
      /* 🌟 狭い画面ではタイトルを優先し、右側ボタンの文字ラベルと補足バッジを隠す */
      .btn-label { display: none; }
      #sync-timestamp { display: none !important; }
    }
  </style>
  <style>
    /* 🌟 現場（手袋・揺れる機内・片手操作）でも押し間違えないよう、入力欄・選択欄・ボタン・選択チップは高さ44px以上にそろえる（原則：タップ領域44px） */
    main input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=range]), main select, main button,
    .modal input:not([type=checkbox]):not([type=radio]):not([type=hidden]), .modal select, .modal button { min-height: 44px; }
    main .chip, main .pill, main .filter-btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    @media print { main button, main .chip, main .pill { min-height: 0; } }
  </style>
</head>
<body class="pb-20">

  <div id="global-loader" style="display:none;">
    <div class="progress-bar-track"><div class="progress-bar-fill"></div></div>
    <div class="font-bold text-slate-800 text-lg mb-2" id="loader-main-text">データ同期中...</div>
    <div class="font-semibold text-slate-500 text-sm text-center max-w-[80%]" id="loader-sub-text">日報データベースを読み込んでいます</div>
  </div>

  <header class="no-print">
    <button type="button" class="hdr-btn" style="flex-shrink:0; white-space:nowrap;" onclick="location.href='portal.html'">◀ ポータル</button>
    <div class="font-black text-base flex items-center gap-2" style="flex:1; min-width:0; overflow:hidden; white-space:nowrap;">
      <span style="overflow:hidden; text-overflow:ellipsis;">統括・業務管理</span> <span class="bg-slate-800 text-white text-[10px] px-1.5 py-0.5 rounded" style="flex-shrink:0;">v1.6</span>
      <span id="sync-timestamp" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 hidden" style="flex-shrink:0;"></span>
    </div>
    <button type="button" class="hdr-btn" style="flex-shrink:0; white-space:nowrap;" onclick="fetchData()">🔄 <span class="btn-label">更新</span></button>
    <button type="button" class="hdr-btn" style="flex-shrink:0; white-space:nowrap;" onclick="window.print()">🖨️ <span class="btn-label">印刷</span></button>
  </header>

  <main class="max-w-5xl mx-auto p-4">
    
    <!-- 🖨️ 印刷用タイトル -->
    <div class="hidden print:block text-2xl font-bold text-center mb-6 border-b-2 border-slate-800 pb-2">
      <span id="print-month-title"></span> 業務実績報告
    </div>

    <!-- コントロールパネル -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between no-print">
      <div id="month-ctrl" class="flex items-center gap-4">
        <button type="button" onclick="changeMonth(-1)" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center font-bold text-slate-600">◀</button>
        <input type="month" id="month-picker" class="font-black text-xl text-slate-800 bg-transparent outline-none cursor-pointer" onchange="fetchData()">
        <button type="button" onclick="changeMonth(1)" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center font-bold text-slate-600">▶</button>
      </div>
      
      <div class="flex bg-slate-100 p-1 rounded-lg">
        <button type="button" id="btn-view-cal" onclick="switchView('cal')" class="px-4 py-1.5 rounded-md text-sm font-bold bg-white text-blue-600 shadow-sm transition">📅 カレンダー</button>
        <button type="button" id="btn-view-list" onclick="switchView('list')" class="px-4 py-1.5 rounded-md text-sm font-bold text-slate-500 hover:text-slate-700 transition">📋 リスト</button>
        <button type="button" id="btn-view-staff" onclick="switchView('staff')" class="px-4 py-1.5 rounded-md text-sm font-bold text-slate-500 hover:text-slate-700 transition">👤 スタッフ別</button>
      </div>
    </div>

    <!-- 業務活動時間の内訳 -->
    <div id="activity-box" class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6 p-5 break-after">
      <h3 class="text-sm font-bold text-slate-700 mb-4 border-b border-slate-200 pb-2">⏱️ 業務活動時間（分数）の内訳</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <div class="relative h-48 w-full">
          <canvas id="activityChart"></canvas>
        </div>
        <div>
          <div id="activity-stats" class="grid grid-cols-2 gap-2 text-sm font-bold text-slate-600"></div>
        </div>
      </div>
    </div>

    <!-- カレンダービュー -->
    <div id="view-cal" class="break-after">
      <div class="cal-grid mb-1">
        <div class="cal-header text-red-500">日</div><div class="cal-header">月</div><div class="cal-header">火</div><div class="cal-header">水</div><div class="cal-header">木</div><div class="cal-header">金</div><div class="cal-header text-blue-500">土</div>
      </div>
      <div id="cal-body" class="cal-grid"></div>
    </div>

    <!-- リストビュー -->
    <div id="view-list" class="hidden print:block print:mt-10">
      <div class="hidden print:block text-lg font-bold text-slate-800 mb-4">■ 日々の特記事項・出動リスト</div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left whitespace-nowrap text-sm">
            <thead class="bg-slate-50 text-slate-500 text-xs border-b border-slate-200">
              <tr><th class="px-4 py-3">日付</th><th class="px-4 py-3">担当Dr / Ns</th><th class="px-4 py-3 text-center">出動</th><th class="px-4 py-3 text-center">Cxl</th><th class="px-4 py-3 min-w-[150px]">待機事由・特記</th><th class="px-4 py-3 text-center no-print">操作</th></tr>
            </thead>
            <tbody id="list-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 🌟 スタッフ別・期間指定リスト：いつ誰がヘリ担当で、要請何件中何件対応し、どこで待機し、何時に勤務終了したかを一覧で見て、その場で直す。
         件数は空欄なら日誌のタイムライン（事案）から自動で数え、入力すると入力値が優先される。編集は日誌シート4列目のJSONに保存され、業務日誌にも表示される -->
    <div id="view-staff" class="hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-4 grid grid-cols-2 md:grid-cols-5 gap-3 items-end no-print">
        <div class="col-span-2 md:col-span-1">
          <label for="staff-filter" class="block text-xs font-bold text-slate-500 mb-1">スタッフ</label>
          <select id="staff-filter" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 text-sm font-bold" onchange="renderStaffList()"></select>
        </div>
        <div>
          <label for="staff-from" class="block text-xs font-bold text-slate-500 mb-1">開始日</label>
          <input type="date" id="staff-from" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 text-sm font-bold" value="2025-04-01" onchange="renderStaffList()">
        </div>
        <div>
          <label for="staff-to" class="block text-xs font-bold text-slate-500 mb-1">終了日</label>
          <input type="date" id="staff-to" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 text-sm font-bold" value="2026-09-30" onchange="renderStaffList()">
        </div>
        <div>
          <label for="staff-place" class="block text-xs font-bold text-slate-500 mb-1">待機場所</label>
          <select id="staff-place" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 text-sm font-bold" onchange="renderStaffList()">
            <option value="">すべて</option><option value="浜町待機">浜町待機</option><option value="院内待機">院内待機</option><option value="その他">その他</option><option value="未選択">未選択</option>
          </select>
        </div>
        <button type="button" onclick="exportStaffCsv()" class="bg-emerald-600 text-white font-bold rounded-lg px-3 text-sm">⬇️ CSV出力</button>
      </div>
      <div id="staff-summary" class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-3 text-sm font-bold text-slate-700"></div>
      <div id="staff-pending" class="hidden bg-red-50 border border-red-200 rounded-xl p-3 mb-3 text-sm font-bold text-red-700 no-print"></div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left whitespace-nowrap text-sm">
            <thead class="bg-slate-50 text-slate-500 text-xs border-b border-slate-200">
              <tr><th class="px-3 py-3">日付</th><th class="px-3 py-3">ナース / ドクター</th><th class="px-3 py-3 text-center">要請</th><th class="px-3 py-3 text-center">対応</th><th class="px-3 py-3">待機場所</th><th class="px-3 py-3">勤務終了</th><th class="px-3 py-3">時間外</th><th class="px-3 py-3 text-center no-print">保存</th><th class="px-3 py-3 text-center no-print">日誌</th></tr>
            </thead>
            <tbody id="staff-body" class="divide-y divide-slate-100"></tbody>
          </table>
          <datalist id="staff-ns-list"></datalist><datalist id="staff-dr-list"></datalist>
        </div>
      </div>
      <p class="text-xs text-slate-500 mt-2 no-print">件数の欄が空のときは、日誌のタイムラインから自動で数えた数（要請＝ヘリ活動＋キャンセル、対応＝ヘリ活動）を薄く表示しています。数値を入れるとその値が優先されます。時間外は勤務終了時刻から16:30を引いた時間です。</p>
    </div>
  </main>

  <script>
    // ===== 日報シート4列目（待機事由）の読み取り =====
    // 🌟 業務日誌（report.html）v12.0から {"v":2,"place":"浜町待機","reasons":[...],...} のJSON文字列で保存される。
    // 旧形式（カンマ区切りの文字）もそのまま表示する。形式を変える時は report.html の parseStandbyInfo と合わせること
    function parseReportReasonJson(raw) {
      const str = String(raw || "").trim();
      if (str.charAt(0) !== "{") return null;
      try { const o = JSON.parse(str); return (o && o.v === 2) ? o : null; } catch (e) { return null; }
    }
    function reportPlaceSummary(o) {
      if (!o.place) return "";
      const placeLabel = o.place === 'その他' ? (o.placeOther ? `その他：${o.placeOther}` : 'その他') : o.place;
      const rs = (o.reasons || []).concat(o.reasonOther ? [o.reasonOther] : []);
      return rs.length ? `${placeLabel}（${rs.join('・')}）` : placeLabel;
    }
    // 一覧表用：待機場所（理由）／特記事項
    function formatReportReason(raw) {
      const o = parseReportReasonJson(raw);
      if (!o) return String(raw || "");
      return [reportPlaceSummary(o), o.handover ? `特記: ${o.handover}` : ""].filter(Boolean).join(" ／ ");
    }
    // カレンダー用：浜町待機以外の日、または理由がある日だけ短く表示（旧形式は従来どおり風・天候・トラブル・待機を含む語）
    function calendarReason(raw) {
      const o = parseReportReasonJson(raw);
      if (!o) return String(raw || "").split(',').filter(r => r.includes('風')||r.includes('天候')||r.includes('トラブル')||r.includes('待機'))[0] || "";
      const rs = (o.reasons || []).concat(o.reasonOther ? [o.reasonOther] : []);
      if (!o.place) return "";
      if (o.place === "浜町待機" && rs.length === 0) return "";
      return rs.length ? `${o.place === 'その他' ? (o.placeOther || 'その他') : o.place}:${rs[0]}` : (o.place === 'その他' ? (o.placeOther || 'その他') : o.place);
    }
    function escapeHtml(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdmgxL3GL-x7sANo05V4nujuZ9CzKTZIuQ-KMNJlawOAJdcMTMZH37c4S0xdSXRFnr/exec";
  // 🌟 サーバー(GAS)への通信に上限時間（60秒）を設ける。以前は保存・読込の多くに上限がなく、電波が途切れると
  // 「通信中」の表示が終わらないまま操作できなくなっていた。上限を超えたら「タイムアウト」のエラーにして、各画面の案内を出す。
  // 個別に上限時間を指定している通信（signal付き）はそのまま使う
  (function() {
    const originalFetch = window.fetch.bind(window);
    window.fetch = function(url, opts) {
      opts = opts || {};
      if (String(url).indexOf(GAS_API_URL) !== 0 || opts.signal) return originalFetch(url, opts);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);
      return originalFetch(url, Object.assign({}, opts, { signal: controller.signal }))
        .catch(e => {
          if (e && e.name === "AbortError") { const err = new Error("サーバーの応答がありません（通信タイムアウト・60秒）。電波状況を確認し、再度お試しください。"); err.isTimeout = true; throw err; }
          throw e;
        })
        .finally(() => clearTimeout(timer));
    };
  })();

    // 🌟 fetchGasJsonを通らない個別通信（保存・削除など）用の共通JSON変換。GASが停止・内部エラーの時は
    // Googleのエラー画面(HTML)が返り、res.json()のままでは「Unexpected token '<'」等の原因不明エラーになるため、
    // fetchGasJsonと同じく応答の冒頭を添えた明確なエラーにする（成功時の動作・タイムアウト・再送の有無は従来どおり）
    async function parseGasResponse(res) {
      const text = await res.text();
      try { return JSON.parse(text); }
      catch (parseErr) { throw new Error(`サーバーが正しいデータを返しませんでした（HTTP ${res.status}: ${text.replace(/<(style|script)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120)}）`); }
    }
    // 🌟 スタッフ用PINは廃止。ログイン必須（未ログインならポータルへ誘導）
    if (!localStorage.getItem('aw109_auth_token')) { location.href = 'portal.html'; }
    // 🌟 勤務シフト想定：ログインから８時間経過で自動ログアウト（現場端末の共有・放置対策）
    (function() {
      const SHIFT_MS = 8 * 60 * 60 * 1000;
      const loginTime = parseInt(localStorage.getItem('aw109_auth_loginTime') || '0', 10);
      if (loginTime && (Date.now() - loginTime > SHIFT_MS)) {
        localStorage.removeItem('aw109_auth_token');
        localStorage.removeItem('aw109_auth_name');
        localStorage.removeItem('aw109_auth_isAdmin');
        localStorage.removeItem('aw109_auth_loginTime');
        alert('ログインから８時間が経過したため、自動的にログアウトしました。お手数ですが再度ログインしてください。');
        location.href = 'portal.html';
      }
    })();
    const PIN_CODE = localStorage.getItem('aw109_auth_token') || "";

    // 🌟 超高感度エラー監視機能 (Failed to fetch 等のネットワーク切断エラーの抑止完全対応)
    window.onerror = function(message, source, lineno, colno, error) {
      const errDetail = `Type: GlobalError\nMsg: ${message}\nSource: ${source || 'N/A'}\nLine: ${lineno}:${colno}\nStack: ${error ? error.stack : 'N/A'}`;
      sendErrorLog(errDetail); 
      return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
      const reason = event.reason ? (event.reason.stack || event.reason) : 'N/A';
      if(String(reason).includes("Load failed") || String(reason).includes("Failed to fetch")) {
        console.warn("ネットワーク切断を検知したため、エラーログ送信をキャンセルしました。");
        return;
      }
      sendErrorLog(`Type: PromiseRejection\nReason: ${reason}`);
    });
    
    let allReports = [];
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1;
    let chartInstance = null;

    const CAT_INFO = {
      mission: { label: 'ヘリ活動', color: '#2563eb' }, 
      cancel: { label: 'キャンセル', color: '#9ca3af' }, 
      inspection: { label: '始業点検', color: '#fb923c' }, 
      inspection_end: { label: '終業点検', color: '#ea580c' }, 
      assistant: { label: '補助者', color: '#fb7185' }, 
      management: { label: '管理業務', color: '#64748b' }, 
      group: { label: 'グループ', color: '#14b8a6' }, 
      other: { label: 'その他', color: '#a855f7' } 
    };

    let loaderTimer1, loaderTimer2;
    function showLoader() {
      document.getElementById("global-loader").style.display = "flex";
      loaderTimer1 = setTimeout(() => { document.getElementById("loader-sub-text").innerText = "データ量が多いため少し時間がかかっています..."; }, 5000);
      loaderTimer2 = setTimeout(() => { document.getElementById("loader-sub-text").innerHTML = "<span style='color:var(--brand);'>電波が弱いか、サーバーの処理に時間がかかっています。<br>このままお待ちください（最大60秒）。</span>"; }, 15000);
    }
    
    function hideLoader() { 
      clearTimeout(loaderTimer1); 
      clearTimeout(loaderTimer2); 
      document.getElementById("global-loader").style.display = "none"; 
    }
    
    function sendErrorLog(errMsg) { 
      if(/Load failed|Failed to fetch|NetworkError|network connection was lost|Internet connection appears to be offline|タイムアウト/.test(String(errMsg))) return; // 🌟 電波切れはアプリの不具合ではないため報告しない（原則A4・メール送信枠の節約）
      try { 
        fetch(GAS_API_URL, { 
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ action: "error_log", source: "業務管理(management.html)", errorMsg: errMsg, userAgent: navigator.userAgent, authName: localStorage.getItem('aw109_auth_name') || '' }),
          redirect: "follow" 
        }); 
      } catch(e) {} 
    }

    // 🌟 日付フォーマットのパディング正規化 (YYYY-MM-DD形式)
    function normalizeDate(rawDate) {
      if (!rawDate) return "";
      let rawDateStr = String(rawDate).split(" ")[0]; 
      let dateParts = rawDateStr.split(/[\/\-]/);
      
      if (dateParts.length === 3) {
        return `${dateParts[0]}-${dateParts[1].padStart(2, '0')}-${dateParts[2].padStart(2, '0')}`;
      }
      return rawDateStr.replace(/\//g, "-");
    }

    // 🌟 同期完了タイムスタンプの更新
    function updateSyncTimestamp() {
      const tsSpan = document.getElementById("sync-timestamp");
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      tsSpan.innerText = `同期: ${timeStr}`;
      tsSpan.classList.remove("hidden");
    }

    window.onload = () => {
      document.getElementById("month-picker").value = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
      fetchData();
    };

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 12) { currentMonth = 1; currentYear++; } 
      else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
      document.getElementById("month-picker").value = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
      fetchData();
    }

    function switchView(view) {
      document.getElementById('view-cal').classList.toggle('hidden', view !== 'cal');
      document.getElementById('view-list').classList.toggle('hidden', view !== 'list');
      document.getElementById('view-staff').classList.toggle('hidden', view !== 'staff');
      // 🌟 スタッフ別は期間で絞るため、月の切替と月間グラフは隠す
      document.getElementById('month-ctrl').classList.toggle('invisible', view === 'staff');
      document.getElementById('activity-box').classList.toggle('hidden', view === 'staff');
      document.body.classList.toggle('staff-mode', view === 'staff');
      const on = "px-4 py-1.5 rounded-md text-sm font-bold bg-white text-blue-600 shadow-sm transition";
      const off = "px-4 py-1.5 rounded-md text-sm font-bold text-slate-500 hover:text-slate-700 transition";
      [['cal', 'btn-view-cal'], ['list', 'btn-view-list'], ['staff', 'btn-view-staff']].forEach(([v, id]) => { document.getElementById(id).className = view === v ? on : off; });
      if (view === 'staff') renderStaffList();
    }

    function timeToMins(tStr) {
      if(!tStr) return 0;
      let p = String(tStr).split(':');
      if(p.length < 2) return 0;
      return parseInt(p[0]) * 60 + parseInt(p[1]);
    }

    async function fetchData() {
      const pickerVal = document.getElementById("month-picker").value;
      if(!pickerVal) return;
      [currentYear, currentMonth] = pickerVal.split('-').map(Number);
      document.getElementById("print-month-title").innerText = `${currentYear}年 ${currentMonth}月`;
      
      showLoader();
      try {
        const res = await fetch(GAS_API_URL, { 
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ action: "fetch_all_reports", password: PIN_CODE }), 
          redirect: "follow" 
        });
        const json = await parseGasResponse(res);
        
        if (json.status === "success") {
          allReports = json.data;
          updateSyncTimestamp();
          renderViews();
          buildStaffOptions();
          if (!document.getElementById('view-staff').classList.contains('hidden')) renderStaffList();
          flushStaffPending();
        } else { throw new Error(json.message); }
      } catch (e) {
        alert("データ同期に失敗しました。接続を確認してください。");
        sendErrorLog(`Msg: ${e.message || e}\nStack: ${e.stack || e.toString()}`);
      } finally {
        hideLoader();
      }
    }

    function renderViews() {
      const targetPrefix = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
      let monthData = {};
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      
      let timeStats = { mission:0, cancel:0, inspection:0, inspection_end:0, assistant:0, management:0, group:0, other:0 };

      for(let d=1; d<=daysInMonth; d++) {
        monthData[`${targetPrefix}-${String(d).padStart(2,'0')}`] = { date: d, dr: "", ns: "", reason: "", mission: 0, cancel: 0, exists: false };
      }

      allReports.forEach(r => {
        // 🌟 日付を完全に正規化してマッチング (ハイフン区切りの前方一致で安全に比較可能に)
        const normalizedReportDate = normalizeDate(r.date);
        if(normalizedReportDate.startsWith(targetPrefix)) {
          let mCount = 0; let cCount = 0;
          if(Array.isArray(r.events)) {
            r.events.forEach(ev => { 
              if(ev.cat === 'mission') mCount++; else if(ev.cat === 'cancel') cCount++; 
              let sMins = timeToMins(ev.start); let eMins = timeToMins(ev.end);
              if(sMins < eMins && timeStats[ev.cat] !== undefined) {
                timeStats[ev.cat] += (eMins - sMins);
              }
            });
          }
          if(monthData[normalizedReportDate]) {
            monthData[normalizedReportDate] = { date: parseInt(normalizedReportDate.split('-')[2]), dr: r.doctor, ns: r.recorder, reason: formatReportReason(r.reason), calReason: calendarReason(r.reason), mission: mCount, cancel: cCount, exists: true };
          }
        }
      });

      const chartLabels = []; const chartData = []; const chartColors = [];
      const statsHtml = [];
      let totalMins = 0;

      Object.keys(timeStats).forEach(key => {
        if(timeStats[key] > 0) {
          totalMins += timeStats[key];
          chartLabels.push(CAT_INFO[key].label);
          chartData.push(timeStats[key]);
          chartColors.push(CAT_INFO[key].color);
          
          let h = Math.floor(timeStats[key]/60); let m = timeStats[key]%60;
          let timeStr = h > 0 ? `${h}時間${m}分` : `${m}分`;
          statsHtml.push(`<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full" style="background-color:${CAT_INFO[key].color}"></span>${CAT_INFO[key].label}: <span class="ml-auto">${timeStr}</span></div>`);
        }
      });

      document.getElementById("activity-stats").innerHTML = statsHtml.join("") || "<div class=\"col-span-2 text-center py-4\">データなし</div>";

      // 🌟 Chart.js(外部CDN)が電波不良で読めなかった場合、ここで例外になり下のカレンダーまで表示されなくなっていた。
      // グラフだけを省略し、カレンダー・一覧の表示は必ず続行する
      if (typeof Chart !== 'undefined') {
        if(chartInstance) chartInstance.destroy();
        const ctx = document.getElementById("activityChart").getContext("2d");
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: { labels: chartLabels, datasets: [{ data: chartData, backgroundColor: chartColors, borderWidth: 1 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '60%' }
        });
      }

      const calBody = document.getElementById("cal-body"); calBody.innerHTML = "";
      const firstDayIndex = new Date(currentYear, currentMonth - 1, 1).getDay();
      
      for(let i=0; i<firstDayIndex; i++) { calBody.innerHTML += `<div class="cal-cell empty"></div>`; }
      
      for(let d=1; d<=daysInMonth; d++) {
        const fullDate = `${targetPrefix}-${String(d).padStart(2,'0')}`;
        const dat = monthData[fullDate];
        const isSun = new Date(currentYear, currentMonth - 1, d).getDay() === 0;
        const isSat = new Date(currentYear, currentMonth - 1, d).getDay() === 6;
        let dateColor = isSun ? "text-red-500" : (isSat ? "text-blue-500" : "text-slate-800");

        let content = `<div class="cal-date ${dateColor}">${d}</div>`;
        if(dat.exists) {
          content += `<div class="cal-staff">Dr: ${dat.dr || '-'}<br>Ns: ${dat.ns || '-'}</div>`;
          if(dat.mission > 0) content += `<div class="cal-badge bg-blue-500">🚁 ${dat.mission}</div>`;
          if(dat.cancel > 0) content += `<div class="cal-badge bg-slate-500">⚠️ ${dat.cancel}</div>`;
          if(dat.calReason) content += `<div class="cal-reason truncate w-full">${escapeHtml(dat.calReason)}</div>`;
        }
        calBody.innerHTML += `<div class="cal-cell" onclick="location.href='report.html?date=${fullDate}'">${content}</div>`;
      }

      const listBody = document.getElementById("list-body"); listBody.innerHTML = "";
      Object.keys(monthData).sort().forEach(dateKey => {
        const dat = monthData[dateKey];
        const weekStr = ["日","月","火","水","木","金","土"][new Date(dateKey.replace(/-/g, '/')).getDay()];
        
        if(dat.exists) {
          listBody.innerHTML += `
            <tr class="hover:bg-blue-50">
              <td class="px-4 py-3 font-mono font-bold text-slate-700">${dateKey} (${weekStr})</td>
              <td class="px-4 py-3 text-slate-600"><span class="font-bold text-slate-800">${dat.dr || '-'}</span> / ${dat.ns || '-'}</td>
              <td class="px-4 py-3 text-center"><span class="bg-blue-100 text-blue-700 font-bold px-2 py-1 rounded">${dat.mission}</span></td>
              <td class="px-4 py-3 text-center"><span class="bg-slate-100 text-slate-600 font-bold px-2 py-1 rounded">${dat.cancel}</span></td>
              <td class="px-4 py-3 text-slate-600 truncate max-w-[200px] print:max-w-none print:whitespace-normal">${escapeHtml(dat.reason) || '-'}</td>
              <td class="px-4 py-3 text-center no-print"><a href="report.html?date=${dateKey}" class="text-blue-600 font-bold text-xs bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100">詳細・日誌</a></td>
            </tr>
          `;
        }
      });
      if(listBody.innerHTML === "") listBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500 font-bold">データがありません</td></tr>`;
    }

    // ===== 👤 スタッフ別・期間指定リスト =====
    // 日誌シート4列目のJSON（{"v":2,...}）に reqCount（要請件数）・respCount（対応件数）・endTime（勤務終了）を足して保存する。
    // 業務日誌（report.html）の getStandbyInfo / applyStandbyInfo も同じ項目名で読み書きする。形式を変える時は両方を直すこと
    const STANDBY_REASONS = { "浜町待機": ["風向き", "天候不良", "強風", "機体トラブル"], "院内待機": ["風向き", "天候不良", "強風", "機体トラブル", "整備・点検"] }; // report.html と同じ一覧
    const OVERTIME_START_MINS = 16 * 60 + 30; // 16:30以降が時間外
    const STAFF_PENDING_KEY = "aw109_mgmt_staff_pending_v1"; // 電波が無くて送れなかった編集（日付ごとの変更項目だけ）を端末内に残す
    const WEEK_JA = ["日","月","火","水","木","金","土"];

    // 4列目の値を、編集できる新形式オブジェクトにする（旧形式のカンマ区切りは特記事項として残す：report.html の parseStandbyInfo と同じ）
    function reasonToEditable(raw) {
      const o = parseReportReasonJson(raw);
      if (o) return Object.assign({}, o);
      const str = String(raw || "").trim();
      return { v: 2, place: "", placeOther: "", reasons: [], reasonOther: "", briefing: "", free: "", handover: str ? str.split(',').map(r => r.trim()).filter(Boolean).join(", ") : "" };
    }
    function autoCounts(r) {
      const ev = Array.isArray(r.events) ? r.events : [];
      const m = ev.filter(e => e.cat === 'mission').length; const c = ev.filter(e => e.cat === 'cancel').length;
      return { req: m + c, resp: m };
    }
    function overtimeMins(endTime) {
      const p = String(endTime || "").split(':');
      if (p.length !== 2 || isNaN(parseInt(p[0], 10)) || isNaN(parseInt(p[1], 10))) return null;
      return Math.max(0, parseInt(p[0], 10) * 60 + parseInt(p[1], 10) - OVERTIME_START_MINS);
    }
    function minsToHm(mins) { return `${Math.floor(mins / 60)}時間${mins % 60}分`; }
    function staffCountVal(v) { return (v === undefined || v === null || String(v).trim() === "") ? "" : String(v).trim(); }
    function findReport(dateKey) { return allReports.find(r => normalizeDate(r.date) === dateKey); }

    // スタッフの選択肢（日誌の記載者＝ナース、フライトドクター＝ドクター）
    function buildStaffOptions() {
      const sel = document.getElementById('staff-filter'); const keep = sel.value;
      const ns = new Set(); const dr = new Set();
      allReports.forEach(r => { if (String(r.recorder || "").trim()) ns.add(String(r.recorder).trim()); if (String(r.doctor || "").trim()) dr.add(String(r.doctor).trim()); });
      const opt = (prefix, set) => [...set].sort((a, b) => a.localeCompare(b, 'ja')).map(n => `<option value="${prefix}:${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("");
      sel.innerHTML = `<option value="">すべて</option><optgroup label="ナース">${opt('ns', ns)}</optgroup><optgroup label="ドクター">${opt('dr', dr)}</optgroup>`;
      // 一覧のナース・ドクター欄の入力候補
      const dl = (set) => [...set].sort((a, b) => a.localeCompare(b, 'ja')).map(n => `<option value="${escapeHtml(n)}">`).join("");
      document.getElementById('staff-ns-list').innerHTML = dl(ns);
      document.getElementById('staff-dr-list').innerHTML = dl(dr);
      if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
    }

    // 絞り込み結果（日付順）。各行は { key, r, info, auto }
    function getStaffRows() {
      const f = document.getElementById('staff-filter').value;
      const from = document.getElementById('staff-from').value || "0000-00-00";
      const to = document.getElementById('staff-to').value || "9999-12-31";
      const place = document.getElementById('staff-place').value;
      const role = f.slice(0, 2); const name = f.slice(3);
      return allReports.map(r => ({ key: normalizeDate(r.date), r: r, info: reasonToEditable(r.reason), auto: autoCounts(r) }))
        .filter(x => x.key && x.key >= from && x.key <= to)
        .filter(x => !f || String((role === 'ns' ? x.r.recorder : x.r.doctor) || "").trim() === name)
        .filter(x => !place || (place === '未選択' ? !x.info.place : x.info.place === place))
        .sort((a, b) => a.key < b.key ? -1 : 1);
    }

    function renderStaffList() {
      const rows = getStaffRows();
      const body = document.getElementById('staff-body');
      let sumReq = 0, sumResp = 0, sumOt = 0, hamaDays = 0, hamaOt = 0;
      body.innerHTML = rows.map(x => {
        const k = x.key; const i = x.info;
        const req = staffCountVal(i.reqCount); const resp = staffCountVal(i.respCount);
        sumReq += Number(req !== "" ? req : x.auto.req) || 0; sumResp += Number(resp !== "" ? resp : x.auto.resp) || 0;
        const ot = overtimeMins(i.endTime);
        if (ot) sumOt += ot;
        if (i.place === '浜町待機') { hamaDays++; if (ot) hamaOt += ot; }
        const placeOpts = ["", "浜町待機", "院内待機", "その他"].map(p => `<option value="${p}" ${i.place === p ? 'selected' : ''}>${p || '未選択'}</option>`).join("");
        const wk = WEEK_JA[new Date(k.replace(/-/g, '/')).getDay()];
        return `<tr class="hover:bg-blue-50 ${i.place === '浜町待機' ? 'bg-amber-50/40' : ''}">
          <td class="px-3 py-2 font-mono font-bold text-slate-700">${k} (${wk})${staffCaseNos(x.r)}</td>
          <td class="px-3 py-2 text-slate-600 whitespace-nowrap"><input type="text" list="staff-ns-list" maxlength="20" placeholder="ナース" class="staff-input w-24 font-bold" data-date="${k}" data-field="recorder" value="${escapeHtml(x.r.recorder || '')}" onchange="onStaffEdit(this)"> / <input type="text" list="staff-dr-list" maxlength="20" placeholder="ドクター" class="staff-input w-24" data-date="${k}" data-field="doctor" value="${escapeHtml(x.r.doctor || '')}" onchange="onStaffEdit(this)"></td>
          <td class="px-3 py-2 text-center"><input type="number" inputmode="numeric" min="0" class="staff-input w-16 text-center" data-date="${k}" data-field="reqCount" value="${escapeHtml(req)}" placeholder="${x.auto.req}" onchange="onStaffEdit(this)"></td>
          <td class="px-3 py-2 text-center"><input type="number" inputmode="numeric" min="0" class="staff-input w-16 text-center" data-date="${k}" data-field="respCount" value="${escapeHtml(resp)}" placeholder="${x.auto.resp}" onchange="onStaffEdit(this)"></td>
          <td class="px-3 py-2"><select class="staff-input" data-date="${k}" data-field="place" onchange="onStaffEdit(this)">${placeOpts}</select>${i.place === 'その他' && i.placeOther ? `<div class="text-xs text-slate-500">${escapeHtml(i.placeOther)}</div>` : ''}</td>
          <td class="px-3 py-2"><input type="text" inputmode="numeric" maxlength="5" placeholder="17:45" class="staff-input w-20 text-center" data-date="${k}" data-field="endTime" value="${escapeHtml(i.endTime || '')}" oninput="formatStaffTime(this)" onchange="clampStaffTime(this); onStaffEdit(this)"></td>
          <td class="px-3 py-2 font-bold ${ot ? 'text-red-600' : 'text-slate-400'}">${ot === null ? '-' : (ot ? minsToHm(ot) : 'なし')}</td>
          <td class="px-3 py-2 text-center text-xs font-bold no-print" id="staff-st-${k}">${getStaffPending()[k] ? '<span class="text-red-600">未送信</span>' : ''}</td>
          <td class="px-3 py-2 text-center no-print"><a href="report.html?date=${k}" class="text-blue-600 font-bold text-xs bg-blue-50 px-3 py-3 rounded-lg inline-block">開く</a></td>
        </tr>`;
      }).join("") || `<tr><td colspan="9" class="text-center py-8 text-slate-500 font-bold">該当する日誌がありません</td></tr>`;
      document.getElementById('staff-summary').innerHTML =
        `${rows.length}日 ／ 要請 ${sumReq}件・対応 ${sumResp}件 ／ 浜町待機 ${hamaDays}日・時間外 ${minsToHm(hamaOt)}` +
        `<span class="text-slate-500 font-semibold">（全待機場所の時間外 ${minsToHm(sumOt)}）</span>`;
      showStaffPendingBanner();
    }

    // 時刻欄：テンキーで「1745」と打つと「17:45」にする（report.html の formatTimeInput / clampTimeInput と同じ動き）
    function formatStaffTime(el) {
      let digits = el.value.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, "").slice(0, 4);
      el.value = digits.length >= 3 ? digits.slice(0, 2) + ":" + digits.slice(2) : digits;
    }
    function clampStaffTime(el) {
      const digits = el.value.replace(/[^0-9]/g, "").slice(0, 4);
      if (!digits) { el.value = ""; return; }
      const hh = Math.min(23, parseInt(digits.slice(0, 2) || "0", 10)); const mm = Math.min(59, parseInt(digits.slice(2) || "0", 10));
      el.value = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function getStaffPending() { try { return JSON.parse(localStorage.getItem(STAFF_PENDING_KEY) || "{}") || {}; } catch (e) { return {}; } }
    function setStaffPending(p) { try { if (Object.keys(p).length) localStorage.setItem(STAFF_PENDING_KEY, JSON.stringify(p)); else localStorage.removeItem(STAFF_PENDING_KEY); } catch (e) {} }
    function showStaffPendingBanner() {
      const n = Object.keys(getStaffPending()).length; const el = document.getElementById('staff-pending');
      el.classList.toggle('hidden', n === 0);
      el.innerText = n ? `電波が戻ったら自動で送信します（未送信 ${n}日分。この端末に保存済み）` : "";
    }

    // その日の要請番号（キャンセルは薄く表示）
    function staffCaseNos(r) {
      const ev = (Array.isArray(r.events) ? r.events : []).filter(e => (e.cat === 'mission' || e.cat === 'cancel') && e.no);
      if (!ev.length) return "";
      return `<div class="text-[11px] font-normal leading-tight mt-0.5">${ev.map(e => `<span class="${e.cat === 'cancel' ? 'text-slate-400' : 'text-blue-700'}">${escapeHtml(e.no)}</span>`).join(" ")}</div>`;
    }

    // 変更項目を日誌の4列目へ反映する（他の項目：待機理由・ブリーフィング・特記・タイムラインはそのまま残す）
    function applyStaffChanges(r, changes) {
      const info = reasonToEditable(r.reason);
      Object.keys(changes).forEach(f => {
        if (f === 'place') {
          const pl = changes.place; info.place = pl;
          if (pl !== 'その他') info.placeOther = "";
          const list = STANDBY_REASONS[pl];
          info.reasons = list ? (info.reasons || []).filter(x => list.includes(x)) : [];
          if (!list) info.reasonOther = "";
        } else if (f === 'reqCount' || f === 'respCount') {
          const v = String(changes[f]).trim();
          info[f] = /^\d{1,3}$/.test(v) ? v : ""; // 数字以外・空欄は「自動」に戻す
        } else if (f === 'recorder' || f === 'doctor') {
          r[f] = String(changes[f] || "").trim(); // ナース(記載者)・ドクターは日誌の2・3列目
        } else if (f === 'endTime') {
          info.endTime = /^\d{2}:\d{2}$/.test(changes.endTime) ? changes.endTime : "";
        }
      });
      r.reason = JSON.stringify(info);
      return info;
    }

    function onStaffEdit(el) {
      const k = el.dataset.date; const r = findReport(k); if (!r) return;
      const pending = getStaffPending();
      pending[k] = Object.assign(pending[k] || {}, { [el.dataset.field]: el.value });
      setStaffPending(pending); // 🌟 送信前に端末内へ残す（原則A3-C：電波が切れても編集が消えない）
      applyStaffChanges(r, { [el.dataset.field]: el.value });
      setTimeout(() => { renderStaffList(); renderViews(); }, 0); // 入力欄のフォーカスが外れる最中に一覧を作り直すとエラーになるため1拍おく
      sendStaffRow(k);
    }

    const staffSending = {};
    async function sendStaffRow(k) {
      if (staffSending[k]) { staffSending[k] = "again"; return; }
      staffSending[k] = true;
      const st = () => document.getElementById('staff-st-' + k);
      if (st()) st().innerHTML = '<span class="text-slate-500">保存中…</span>';
      const r = findReport(k);
      const sentChanges = JSON.stringify(getStaffPending()[k] || {});
      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "save_daily_report", password: PIN_CODE, date: k, recorder: r.recorder || "", doctor: r.doctor || "", hamamachiReason: r.reason, events: Array.isArray(r.events) ? r.events : [] }),
          redirect: "follow"
        });
        const json = await parseGasResponse(res);
        if (json.status !== "success") throw new Error(json.message || "保存に失敗しました");
        const pending = getStaffPending();
        if (JSON.stringify(pending[k] || {}) === sentChanges) { delete pending[k]; setStaffPending(pending); } // 送信中に更に直した分は残す
        if (st()) st().innerHTML = '<span class="text-emerald-600">✓ 保存</span>';
      } catch (e) {
        const isNetwork = e.isTimeout || /Load failed|Failed to fetch|NetworkError|network connection was lost|offline/i.test(String(e.message || e));
        if (st()) st().innerHTML = '<span class="text-red-600">未送信</span>';
        if (!isNetwork) { // 🌟 電波切れは静かに再送待ち。アプリ内部のエラーだけ知らせる（原則A4）
          alert(`${k} の保存に失敗しました：${e.message || e}\n入力内容はこの端末に残っています。`);
          sendErrorLog(`Msg: ${e.message || e}\nStack: ${e.stack || e.toString()}`);
        }
      } finally {
        const again = staffSending[k] === "again"; delete staffSending[k];
        showStaffPendingBanner();
        if (again && getStaffPending()[k]) sendStaffRow(k);
      }
    }

    // 未送信の編集を、最新の日誌データに重ねてから送り直す（古いタイムラインで上書きしないため、変更項目だけを持っておく）
    function flushStaffPending() {
      const pending = getStaffPending();
      Object.keys(pending).forEach(k => {
        const r = findReport(k);
        if (!r) { delete pending[k]; return; }
        applyStaffChanges(r, pending[k]);
      });
      setStaffPending(pending);
      if (Object.keys(pending).length) { renderViews(); if (!document.getElementById('view-staff').classList.contains('hidden')) renderStaffList(); }
      Object.keys(pending).forEach(k => sendStaffRow(k));
    }
    window.addEventListener('online', () => { if (allReports.length) flushStaffPending(); });

    // CSV出力（Excelで文字化けしないようBOM付きUTF-8。先頭が = + - @ の値は数式にならないよう ' を付ける）
    function exportStaffCsv() {
      const rows = getStaffRows();
      if (!rows.length) return alert("出力する日誌がありません。");
      const cell = v => { let t = String(v == null ? "" : v); if (/^[=+\-@]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
      const lines = [["日付", "曜日", "ナース(記載者)", "フライトドクター", "要請件数", "対応件数", "件数の入力", "待機場所", "待機理由", "勤務終了", "時間外(分)", "時間外", "要請番号"].map(cell).join(",")];
      rows.forEach(x => {
        const i = x.info; const req = staffCountVal(i.reqCount); const resp = staffCountVal(i.respCount); const ot = overtimeMins(i.endTime);
        const place = i.place === 'その他' && i.placeOther ? `その他：${i.placeOther}` : (i.place || "");
        const reasons = (i.reasons || []).concat(i.reasonOther ? [i.reasonOther] : []).join("・");
        lines.push([x.key, WEEK_JA[new Date(x.key.replace(/-/g, '/')).getDay()], x.r.recorder || "", x.r.doctor || "",
          req !== "" ? req : x.auto.req, resp !== "" ? resp : x.auto.resp, (req !== "" || resp !== "") ? "手入力" : "自動",
          place, reasons, i.endTime || "", ot === null ? "" : ot, ot === null ? "" : minsToHm(ot),
          (Array.isArray(x.r.events) ? x.r.events : []).filter(e => (e.cat === 'mission' || e.cat === 'cancel') && e.no).map(e => e.no + (e.cat === 'cancel' ? '(キャンセル)' : '')).join(" ")].map(cell).join(","));
      });
      const f = document.getElementById('staff-filter').value;
      const who = f ? f.slice(3) : "全員";
      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `スタッフ別_${who}_${document.getElementById('staff-from').value}_${document.getElementById('staff-to').value}.csv`.replace(/[\\/:*?"<>|]/g, "_");
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
  </script>
</body>
