<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>業務日報 (業務日誌)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <style>
    :root { --bg: #f2f2f7; --card: #ffffff; --ink: #1c1c1e; --sub: #8e8e93; --blue: #007aff; --brand: #d32f2f; --line: rgba(60,60,67,0.12); }
    body { font-family: -apple-system, sans-serif; background-color: var(--bg); color: var(--ink); margin: 0; padding: 0; }
    
    header { position: fixed; top: 0; left: 0; right: 0; height: calc(56px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); padding-left: 16px; padding-right: 16px; background: rgba(242,242,247,0.92); backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--line); display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    .hdr-group { display: flex; gap: 12px; align-items: center; flex-shrink: 0; } 
    .hdr-btn { color: var(--blue); background: none; border: none; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    /* 🌟 現場基準（A3）：ヘッダーボタンも手袋・揺れる機内で確実に押せるよう、見た目と配置は変えずにタップ領域だけを広げる。
       高さは44pxを確保し、横幅は透明な当たり判定(::after)を左右6pxずつ（隣のボタンとの隙間の半分）伸ばす。
       横幅そのものを44pxにするとタイトルが「…」で省略されてしまうため採用しない */
    .hdr-btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; position: relative; }
    .hdr-btn::after { content: ''; position: absolute; top: 0; bottom: 0; left: -6px; right: -6px; }
    .title-box { text-align: center; font-weight: 800; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } 
    .version-tag { font-size: 10px; color: #fff; font-weight: bold; background: var(--blue); padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
    
    main { margin-top: calc(56px + env(safe-area-inset-top)); padding: 16px; max-width: 900px; margin-left: auto; margin-right: auto; padding-bottom: 80px; }
    .hidden { display: none !important; }
    
    /* 🌟 Tailwindの!important干渉を回避する印刷専用定義 */
    .print-only-container { display: none; }
    @media print { 
      @page { size: portrait; margin: 5mm; } 
      /* 🌟 以前はtransform:scale(0.65)で縮小しており、文字が約6ptと小さすぎるうえ、ページの区切りは縮小前の高さで計算されるため
         1枚目の下1/3が空白のまま2枚目に続いていた。zoomなら区切り位置も縮小後で計算される */
      body { background: white; zoom: 0.8; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin-top: 0; }
      tr { break-inside: avoid; }
      td.truncate { white-space: normal !important; max-width: none !important; overflow: visible !important; text-overflow: clip !important; } /* 内容欄を「…」で切らずに全文印刷する */
      header { display: none !important; } 
      main { margin-top: 0; padding: 0; } 
      .no-print { display: none !important; } 
      #entry-form-container { display: none !important; } 
      .print-only-container { display: block !important; }
    }
    
    #global-loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(0,122,255,0.2); border-top: 4px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .progress-bar-track { width: 200px; height: 6px; background: rgba(0,122,255,0.15); border-radius: 3px; overflow: hidden; margin-bottom: 16px; position: relative; }
    .progress-bar-fill { position: absolute; top: 0; left: -40%; height: 100%; width: 40%; background: var(--blue); border-radius: 3px; animation: indeterminate 1.1s ease-in-out infinite; }
    @keyframes indeterminate { 0% { left: -40%; } 100% { left: 100%; } }
    .loader-text { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
    .loader-subtext { font-size: 13px; font-weight: 600; color: var(--sub); text-align: center; max-width: 80%; }
    @media (max-width: 400px) {
      /* 🌟 狭い画面ではタイトルを優先し、右側ボタンの文字ラベル・バージョンタグ・補足バッジを隠す */
      .btn-label { display: none; }
      .title-box .version-tag { display: none; }
      .title-box { font-size: 14px; }
      #sync-timestamp { display: none !important; }
    }
  </style>
  <style>
    /* 🌟 現場（手袋・揺れる機内・片手操作）でも押し間違えないよう、入力欄・選択欄・ボタン・選択チップは高さ44px以上にそろえる（原則：タップ領域44px） */
    main input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=range]), main select, main button,
    .modal input:not([type=checkbox]):not([type=radio]):not([type=hidden]), .modal select, .modal button { min-height: 44px; }
    main .chip, main .pill, main .filter-btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    @media print { main button, main .chip, main .pill { min-height: 0; } }
    /* 待機場所・待機理由の選択ボタン（押した物が青く光る） */
    .place-pill, .reason-pill { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; font-size: 14px; font-weight: 700; color: #475569; cursor: pointer; }
    .place-pill input, .reason-pill input { width: 18px; height: 18px; }
    .place-pill:has(input:checked), .reason-pill:has(input:checked) { background: #e0efff; border-color: var(--blue); color: #0b4fa3; }
    .print-pre { white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="global-loader" class="hidden">
    <div class="progress-bar-track"><div class="progress-bar-fill"></div></div>
    <div class="loader-text" id="loader-main-text">データを通信中...</div>
    <div class="loader-subtext" id="loader-sub-text">データベースに接続しています</div>
  </div>

  <header class="no-print">
    <div class="hdr-group">
      <button type="button" id="btn-back" class="hdr-btn" onclick="location.href='portal.html'">◀ ポータル</button>
      <span id="sync-timestamp" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 hidden"></span>
    </div>
    <div class="title-box">業務日報 (業務日誌)<span class="version-tag">v12.1</span></div>
    <div class="hdr-group"><button type="button" class="hdr-btn" onclick="window.print()">🖨️ <span class="btn-label">印刷</span></button></div>
  </header>

  <main>
    <!-- 🌟 印刷時にTailwindのバグを回避して100%表示されるように修正 -->
    <div class="print-only-container mb-4 border-2 border-slate-800 p-4 rounded-lg bg-white">
      <div class="flex justify-between font-bold text-sm mb-2">
        <span class="text-lg tracking-widest font-extrabold">業務日報（業務日誌）</span>
        <span class="text-lg">日付: <span id="print-date"></span></span>
      </div>
      <div class="flex justify-between font-bold text-sm mb-2 border-t border-slate-200 pt-2">
        <span>フライトドクター: <span id="print-dr" class="font-black text-slate-800">未入力</span></span>
        <span>記載者(Ns): <span id="print-ns" class="font-black text-slate-800">未入力</span></span>
      </div>
      <div class="font-bold text-sm border-t border-slate-200 pt-2 mt-1">待機場所・待機理由: <span id="print-reason">未入力</span></div>
      <div class="font-bold text-sm">件数・勤務終了: <span id="print-counts"></span></div>
      <div id="print-briefing-box" class="text-sm border-t border-slate-200 pt-2 mt-1 hidden"><div class="font-bold">ブリーフィング</div><div id="print-briefing" class="print-pre"></div></div>
      <div id="print-free-box" class="text-sm border-t border-slate-200 pt-2 mt-1 hidden"><div class="font-bold">フリー内容</div><div id="print-free" class="print-pre"></div></div>
      <div id="print-handover-box" class="text-sm border-t border-slate-200 pt-2 mt-1 hidden"><div class="font-bold">特記事項・引き継ぎ事項</div><div id="print-handover" class="print-pre"></div></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6 p-4 flex flex-wrap gap-3 justify-between items-center no-print">
      <div class="text-sm font-bold text-slate-600 flex items-center gap-2"><span class="text-xl">📋</span> 日報データの操作</div>
      <div class="flex flex-wrap gap-2">
        <button type="button" onclick="syncFromDb(true)" class="px-4 py-2.5 bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-sm font-bold hover:bg-slate-200 transition-colors">🚁 症例情報を再取り込み</button>
        <button type="button" onclick="resetAll()" class="px-4 py-2.5 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm font-bold hover:bg-red-100 transition-colors">🗑️ クリア</button>
        <button type="button" onclick="saveReport()" class="px-6 py-2.5 text-white rounded-lg text-sm font-bold hover:opacity-90 shadow-sm" style="background-color: var(--blue);">💾 日報を確定・保存</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6 p-5 no-print">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">日付</label>
            <input type="date" id="info-date" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm outline-none font-bold text-slate-700" onchange="calculateSun(); syncFromDb(false);">
          </div>
          <div id="sun-display" class="flex flex-wrap gap-x-3 gap-y-1 text-xs bg-amber-50 px-3 py-2.5 rounded-lg border border-amber-100 text-amber-800 font-medium"></div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">記載者 (Ns)</label>
              <select id="info-nurse" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm outline-none font-bold text-slate-700" onchange="toggleCustomInput('info-nurse', 'info-nurse-other'); updatePrintHeader();"></select>
              <input type="text" id="info-nurse-other" placeholder="氏名" class="hidden mt-2 w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm" onchange="updatePrintHeader();">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">フライトドクター</label>
              <select id="info-doctor" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm outline-none font-bold text-slate-700" onchange="toggleCustomInput('info-doctor', 'info-doctor-other'); updatePrintHeader();"></select>
              <input type="text" id="info-doctor-other" placeholder="氏名" class="hidden mt-2 w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm" onchange="updatePrintHeader();">
            </div>
          </div>
          <!-- 🌟 待機場所：浜町待機・院内待機を選んだ時だけ待機理由を出す。その他は場所を手入力 -->
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">待機場所</label>
            <div class="grid grid-cols-3 gap-2">
              <label class="place-pill"><input type="radio" name="standby-place" value="浜町待機" onchange="onPlaceChange()"><span>浜町待機</span></label>
              <label class="place-pill"><input type="radio" name="standby-place" value="院内待機" onchange="onPlaceChange()"><span>院内待機</span></label>
              <label class="place-pill"><input type="radio" name="standby-place" value="その他" onchange="onPlaceChange()"><span>その他</span></label>
            </div>
            <input type="text" id="info-place-other" placeholder="待機場所（手入力）" class="hidden mt-2 w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm" onchange="updatePrintHeader()">
          </div>
          <div id="reason-box" class="hidden">
            <label class="block text-xs font-bold text-slate-500 mb-1">待機理由</label>
            <div id="reason-options" class="flex flex-wrap gap-2 mb-2"></div>
            <input type="text" id="info-reason-other" placeholder="その他の待機理由（自由入力）" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm" onchange="updatePrintHeader()">
          </div>
          <!-- 🌟 件数・勤務終了：空欄なら、タイムラインの事案から自動で数える。入力した数値が優先される。業務管理の「スタッフ別」一覧からも編集できる -->
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label for="info-req-count" class="block text-xs font-bold text-slate-500 mb-1">要請件数</label>
              <input type="number" inputmode="numeric" min="0" id="info-req-count" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold" oninput="updatePrintHeader()">
            </div>
            <div>
              <label for="info-resp-count" class="block text-xs font-bold text-slate-500 mb-1">対応件数</label>
              <input type="number" inputmode="numeric" min="0" id="info-resp-count" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold" oninput="updatePrintHeader()">
            </div>
            <div>
              <label for="info-end-time" class="block text-xs font-bold text-slate-500 mb-1">勤務終了</label>
              <input type="text" inputmode="numeric" maxlength="5" placeholder="17:45" id="info-end-time" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold" oninput="formatTimeInput(this)" onchange="clampTimeInput(this); updatePrintHeader()">
            </div>
          </div>
          <div id="info-overtime" class="text-xs font-bold text-slate-500"></div>
        </div>
        <div class="md:col-span-2 space-y-4">
          <!-- 🌟 鹿児島市（薩摩地方）の天気概況：気象庁の公開データを表示するだけ（保存はしない）。電波がない時は静かに「取得できません」と出す -->
          <div id="weather-box" class="bg-sky-50 border border-sky-200 rounded-lg p-3">
            <div class="flex justify-between items-center gap-2 mb-1">
              <span class="text-xs font-bold text-sky-800">☁️ 鹿児島の天気概況（気象庁）</span>
              <button type="button" onclick="fetchWeather()" class="text-xs font-bold text-sky-700 bg-white border border-sky-200 rounded-lg px-3 min-h-[44px]">↻ 更新</button>
            </div>
            <div id="weather-today" class="text-sm font-bold text-slate-800"></div>
            <div id="weather-text" class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">読み込み中...</div>
            <div id="weather-time" class="text-xs text-slate-500 mt-1"></div>
          </div>
          <div>
            <label for="info-briefing" class="block text-xs font-bold text-slate-500 mb-1">ブリーフィング</label>
            <textarea id="info-briefing" rows="4" placeholder="ブリーフィングの内容（天候・機体・人員・連絡事項など）" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm outline-none" onchange="updatePrintHeader()"></textarea>
          </div>
          <div>
            <label for="info-free" class="block text-xs font-bold text-slate-500 mb-1">フリー内容</label>
            <textarea id="info-free" rows="3" placeholder="自由記載" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm outline-none" onchange="updatePrintHeader()"></textarea>
          </div>
          <div>
            <label for="info-remarks" class="block text-xs font-bold text-slate-500 mb-1">特記事項・引き継ぎ事項</label>
            <textarea id="info-remarks" rows="3" placeholder="次の勤務者への引き継ぎなど" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm outline-none" onchange="updatePrintHeader()"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div id="entry-form-container" class="bg-blue-50 rounded-xl shadow-sm border border-blue-200 mb-6 overflow-hidden no-print">
      <div class="px-5 py-3 border-b border-blue-200 flex justify-between items-center bg-blue-100/50">
        <h2 id="form-title" class="text-sm font-bold text-blue-900 flex items-center gap-2">➕ タイムラインの追加</h2>
        <button type="button" id="btn-cancel-edit" onclick="cancelEdit()" class="hidden text-xs bg-white border border-slate-300 px-3 py-1.5 rounded-md text-slate-600 font-bold hover:bg-slate-50">キャンセル</button>
      </div>
      <div class="p-5 grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
        <div class="md:col-span-3"><label class="block text-xs font-bold text-slate-500 mb-1">業務種別</label><select id="event-cat" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm outline-none font-bold text-slate-700"><option value="mission">🚁 ヘリ活動(実施)</option><option value="cancel">⚠️ キャンセル</option><option value="inspection">⚙️ 始業点検</option><option value="inspection_end">🛠️ 終業点検</option><option value="assistant">🏃 補助者</option><option value="management">📁 管理</option><option value="group">👥 グループ</option><option value="other">💼 その他</option></select></div>
        <!-- 🌟 「事案No」から、手動入力を想定した統一名称「要請番号 / タイトル」へ改善 -->
        <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-500 mb-1">要請番号 / タイトル</label><input type="text" id="event-no" placeholder="12345 等" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm outline-none text-center font-bold" oninput="toHalfWidth(this)"></div>
        <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-500 mb-1">開始時間</label><input type="tel" inputmode="numeric" maxlength="5" placeholder="HH:MM" id="event-start" oninput="formatTimeInput(this)" onblur="clampTimeInput(this)" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm outline-none text-center font-mono font-bold"></div>
        <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-500 mb-1">終了時間</label><input type="tel" inputmode="numeric" maxlength="5" placeholder="HH:MM" id="event-end" oninput="formatTimeInput(this)" onblur="clampTimeInput(this)" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm outline-none text-center font-mono font-bold"></div>
        <div class="md:col-span-2 flex items-center h-10 px-2 bg-white rounded-lg border border-slate-300 mb-[1px]"><label class="flex items-center gap-2 text-sm font-bold text-slate-700 cursor-pointer w-full justify-center"><input type="checkbox" id="event-continuous" class="w-4 h-4 text-blue-600"> 連続出動</label></div>
        <div class="md:col-span-12 mt-2"><label class="block text-xs font-bold text-slate-500 mb-1">内容</label><div class="flex gap-3"><input type="text" id="event-desc" placeholder="活動内容..." class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm outline-none font-medium" oninput="toHalfWidth(this)" onkeydown="if(event.key==='Enter') saveEvent()"><button type="button" id="btn-save" onclick="saveEvent()" class="text-white font-bold px-8 py-2.5 rounded-lg whitespace-nowrap hover:opacity-90 shadow-sm" style="background-color: var(--blue);">追加する</button></div></div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-md border border-slate-200 mb-6 overflow-hidden">
      <div class="px-4 py-2.5 border-b border-slate-100 bg-slate-50 flex gap-4 text-xs font-bold text-slate-600 flex-wrap" id="legend-box"></div>
      <div class="overflow-x-auto relative min-h-[160px]" style="padding-bottom: 20px;"><div class="min-w-[1000px] relative h-32 mx-4 mt-8" id="chart-area"><div id="chart-grid" class="absolute inset-0 pointer-events-none"></div><div id="chart-bars" class="absolute inset-0 top-1/2 -translate-y-1/2 h-16"></div></div></div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
      <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 font-bold text-slate-700 text-sm">📋 リスト</div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
          <thead class="bg-slate-100 text-slate-500 text-xs border-b border-slate-300"><tr><th class="px-4 py-3 w-32">種別</th><th class="px-4 py-3 w-24">No / タイトル</th><th class="px-4 py-3 w-32">時間</th><th class="px-4 py-3 w-20">時間</th><th class="px-4 py-3 min-w-[200px]">内容</th><th class="px-4 py-3 w-24 text-center no-print">操作</th></tr></thead>
          <tbody id="list-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="sync-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
      <h3 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">⚠️ 活動時間の重複</h3>
      <p class="text-sm text-slate-600 mb-6 leading-relaxed">取り込もうとしている事案（ヘリ活動）の時間が、すでに入力されている日誌の活動時間と重複しています。<br>重複したスケジュールをどう処理しますか?</p>
      <div class="flex flex-col gap-3">
        <button type="button" onclick="resolveSync('overwrite')" class="bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 shadow-sm transition">🚁 事案の時間を優先する (重複は手動削除)</button>
        <button type="button" onclick="resolveSync('keep')" class="bg-slate-100 text-slate-700 border border-slate-300 font-bold py-3.5 rounded-xl hover:bg-slate-200 transition">📝 日誌の時間を残す (今回は取り込まない)</button>
        <button type="button" onclick="resolveSync('cancel')" class="text-slate-500 font-bold py-2 mt-1">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzdmgxL3GL-x7sANo05V4nujuZ9CzKTZIuQ-KMNJlawOAJdcMTMZH37c4S0xdSXRFnr/exec";
  // 🌟 サーバー(GAS)への通信に上限時間（60秒）を設ける。以前は保存・読込の多くに上限がなく、電波が途切れると
  // 「通信中」の表示が終わらないまま操作できなくなっていた。上限を超えたら「タイムアウト」のエラーにして、各画面の案内を出す。
  // 個別に上限時間を指定している通信（signal付き）はそのまま使う
  (function() {
    const originalFetch = window.fetch.bind(window);
    window.fetch = function(url, opts) {
      opts = opts || {};
      if (String(url).indexOf(GAS_API_URL) !== 0 || opts.signal) return originalFetch(url, opts);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);
      return originalFetch(url, Object.assign({}, opts, { signal: controller.signal }))
        .catch(e => {
          if (e && e.name === "AbortError") { const err = new Error("サーバーの応答がありません（通信タイムアウト・60秒）。電波状況を確認し、再度お試しください。"); err.isTimeout = true; throw err; }
          throw e;
        })
        .finally(() => clearTimeout(timer));
    };
  })();
    // 🌟 スタッフ用PINは廃止。ログイン必須（未ログインならポータルへ誘導）
    if (!localStorage.getItem('aw109_auth_token')) { location.href = 'portal.html'; }
    // 🌟 勤務シフト想定：ログインから８時間経過で自動ログアウト（現場端末の共有・放置対策）
    (function() {
      const SHIFT_MS = 8 * 60 * 60 * 1000;
      const loginTime = parseInt(localStorage.getItem('aw109_auth_loginTime') || '0', 10);
      if (loginTime && (Date.now() - loginTime > SHIFT_MS)) {
        localStorage.removeItem('aw109_auth_token');
        localStorage.removeItem('aw109_auth_name');
        localStorage.removeItem('aw109_auth_isAdmin');
        localStorage.removeItem('aw109_auth_loginTime');
        alert('ログインから８時間が経過したため、自動的にログアウトしました。お手数ですが再度ログインしてください。');
        location.href = 'portal.html';
      }
    })();
    const PIN_CODE = localStorage.getItem('aw109_auth_token') || "";

    window.onerror = function(message, source, lineno, colno, error) {
      const errDetail = `Type: GlobalError\nMsg: ${message}\nSource: ${source || 'N/A'}\nLine: ${lineno}:${colno}\nStack: ${error ? error.stack : 'N/A'}`;
      sendErrorLog(errDetail); 
      return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
      const reason = event.reason ? (event.reason.stack || event.reason) : 'N/A';
      if(String(reason).includes("Load failed") || String(reason).includes("Failed to fetch")) {
        console.warn("オフライン・通信障害を検知。");
        return;
      }
      sendErrorLog(`Type: PromiseRejection\nReason: ${reason}`);
    });

    const START_HOUR = 8; const END_HOUR = 19; const TOTAL_MINUTES = (END_HOUR - START_HOUR) * 60;

    const CATS = {
      mission: { label: 'ヘリ活動', color: 'bg-blue-600', prep: 10, rec: 'auto' },
      cancel: { label: 'キャンセル', color: 'bg-gray-400', prep: 10, rec: 10 },
      inspection: { label: '始業点検', color: 'bg-orange-400', prep: 0, rec: 0 },
      inspection_end: { label: '終業点検', color: 'bg-orange-600', prep: 0, rec: 0 },
      assistant: { label: '補助者', color: 'bg-rose-400', prep: 0, rec: 0 },
      management: { label: '管理業務', color: 'bg-slate-500', prep: 0, rec: 0 },
      group: { label: 'グループ', color: 'bg-teal-500', prep: 0, rec: 0 },
      other: { label: 'その他', color: 'bg-purple-500', prep: 0, rec: 0 }
    };

    let events = []; let editingId = null; 
    let tempAutoEvents = []; let tempManualEvents = [];
    
    let loaderTimer1, loaderTimer2;
    function showLoader(show, msg1="通信中...", msg2="データベースに接続しています") { 
      const loader = document.getElementById('global-loader'); 
      if (show) { 
        document.getElementById('loader-main-text').innerText = msg1; 
        document.getElementById('loader-sub-text').innerHTML = msg2;
        loader.classList.remove('hidden'); 
        loader.style.display = "flex";
        loaderTimer1 = setTimeout(() => { document.getElementById("loader-sub-text").innerText = "電波が弱い可能性があります。そのままお待ちください..."; }, 5000);
        loaderTimer2 = setTimeout(() => { document.getElementById("loader-sub-text").innerHTML = "<span style='color:var(--brand);'>電波が弱いか、サーバーの処理に時間がかかっています。<br>このままお待ちください（最大60秒）。</span>"; }, 15000);
      } else { 
        clearTimeout(loaderTimer1); clearTimeout(loaderTimer2);
        loader.classList.add('hidden'); 
        loader.style.display = "none";
      } 
    }
    
    function sendErrorLog(errMsg) { 
      if(/Load failed|Failed to fetch|NetworkError|network connection was lost|Internet connection appears to be offline|タイムアウト/.test(String(errMsg))) return; // 🌟 電波切れはアプリの不具合ではないため報告しない（原則A4・メール送信枠の節約）
      try { 
        fetch(GAS_API_URL, { 
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ action: "error_log", source: "業務日誌(report.html)", errorMsg: errMsg, userAgent: navigator.userAgent, authName: localStorage.getItem('aw109_auth_name') || '' }),
          redirect: "follow" 
        }); 
      } catch(e) {} 
    }

    function toHalfWidth(ele) { let val = ele.value; val = val.replace(/[０-９]/g, function(s) { return String.fromCharCode(s.charCodeAt(0) - 0xFEE0); }); ele.value = val; }
    // 🌟 ネイティブのtime picker(スクロールで選ぶUI)は現場では入力しづらいため、
    // テンキーで "1430" のように打つと自動で "14:30" に整形するテキスト入力に置き換える
    function formatTimeInput(el) {
      toHalfWidth(el);
      let digits = el.value.replace(/[^0-9]/g, "").slice(0, 4);
      if (digits.length >= 3) { el.value = digits.slice(0, 2) + ":" + digits.slice(2); }
      else { el.value = digits; }
    }
    function clampTimeInput(el) {
      const digits = el.value.replace(/[^0-9]/g, "").slice(0, 4);
      if (digits.length === 0) { el.value = ""; return; }
      let hh = Math.min(23, Math.max(0, parseInt(digits.slice(0, 2) || "0", 10)));
      let mm = Math.min(59, Math.max(0, parseInt(digits.slice(2) || "0", 10)));
      el.value = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    }

    function normalizeDate(rawDate) {
      if (!rawDate) return "";
      let rawDateStr = String(rawDate).split(" ")[0]; 
      let dateParts = rawDateStr.split(/[\/\-]/);
      if (dateParts.length === 3) {
        return `${dateParts[0]}-${dateParts[1].padStart(2, '0')}-${dateParts[2].padStart(2, '0')}`;
      }
      return rawDateStr.replace(/\//g, "-");
    }

    function updateSyncTimestamp() {
      const tsSpan = document.getElementById("sync-timestamp");
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      tsSpan.innerText = `最終同期: ${timeStr}`;
      tsSpan.classList.remove("hidden");
    }

    window.onload = () => { 
      const urlParams = new URLSearchParams(window.location.search);
      const urlDate = urlParams.get('date');
      document.getElementById('info-date').value = normalizeDate(urlDate) || (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })(); // 🌟 toISOString()は世界標準時の日付のため、日本時間の0〜9時に開くと前日の日付になっていた。端末の日付を使う
      
      if(urlDate) {
        const backBtn = document.getElementById("btn-back");
        backBtn.innerHTML = "◀ 業務管理";
        backBtn.onclick = () => location.href = "management.html";
      }
      
      drawGrid(); drawLegend(); calculateSun(); updatePrintHeader(); fetchInit(); fetchWeather();
    };

    // ===== 鹿児島の天気概況（気象庁の公開データ・APIキー不要） =====
    // 460100 = 鹿児島県（奄美地方除く）、460010 = 薩摩地方（鹿児島市を含む）。
    // ブリーフィングでCSが読み上げる内容の確認用。日報には保存しない。
    // 電波がない時はエラー報告もアラートも出さず、「取得できません」と表示するだけ（原則A4）
    async function fetchWeather() {
      const elText = document.getElementById('weather-text');
      const elToday = document.getElementById('weather-today');
      const elTime = document.getElementById('weather-time');
      elText.textContent = "読み込み中...";
      const getJson = async (url) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        try { const res = await fetch(url, { signal: controller.signal, cache: "no-store" }); if (!res.ok) throw new Error("HTTP " + res.status); return await res.json(); }
        finally { clearTimeout(timer); }
      };
      try {
        const [overview, forecast] = await Promise.all([
          getJson("https://www.jma.go.jp/bosai/forecast/data/overview_forecast/460100.json"),
          getJson("https://www.jma.go.jp/bosai/forecast/data/forecast/460100.json").catch(() => null)
        ]);
        elText.textContent = String(overview.text || "").replace(/\n\n+/g, "\n").trim() || "概況の発表がありません";
        const t = new Date(overview.reportDatetime);
        elTime.textContent = isNaN(t) ? "" : `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} ${overview.publishingOffice || ""}発表`;
        elToday.textContent = "";
        try {
          const area = forecast[0].timeSeries[0].areas.find(a => a.area && a.area.code === "460010");
          if (area) {
            const clean = v => String(v || "").replace(/\u3000/g, " ").trim();
            const parts = [`今日（薩摩地方）：${clean(area.weathers && area.weathers[0])}`];
            if (area.winds && area.winds[0]) parts.push(`風：${clean(area.winds[0])}`);
            if (area.waves && area.waves[0]) parts.push(`波：${clean(area.waves[0])}`);
            elToday.textContent = parts.join(" ／ ");
          }
        } catch (e) { /* 予報部分が読めなくても概況は表示する */ }
      } catch (e) {
        elToday.textContent = "";
        elText.textContent = "天気概況を取得できません（電波状況を確認し「更新」を押してください）";
        elTime.textContent = "";
      }
    }

    // 🌟 サーバー側の応答が返ってこない（ハング）場合、fetch自体は永遠に待ち続けてしまうため
    // 20秒でタイムアウトさせ打ち切る（GASのコールドスタート等で発生しうる）
    // 🌟 fetchGasJsonを通らない個別通信（保存・削除など）用の共通JSON変換。GASが停止・内部エラーの時は
    // Googleのエラー画面(HTML)が返り、res.json()のままでは「Unexpected token '<'」等の原因不明エラーになるため、
    // fetchGasJsonと同じく応答の冒頭を添えた明確なエラーにする（成功時の動作・タイムアウト・再送の有無は従来どおり）
    async function parseGasResponse(res) {
      const text = await res.text();
      try { return JSON.parse(text); }
      catch (parseErr) { throw new Error(`サーバーが正しいデータを返しませんでした（HTTP ${res.status}: ${text.replace(/<(style|script)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120)}）`); }
    }

    async function fetchGasJson(bodyObj) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);
      try {
        const res = await fetch(GAS_API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(bodyObj), redirect: "follow", signal: controller.signal });
        // 🌟 GASが停止・内部エラーの時はJSONではなくGoogleのエラー画面(HTML)が返り、res.json()のままでは
        // 「Unexpected token '<'」「The string did not match the expected pattern」という原因不明のエラーになる。
        // 中身を確認し、エラー報告メールでGAS側の原因が読めるよう応答の冒頭を添えて明確なエラーにする
        const text = await res.text();
        try { return JSON.parse(text); }
        catch (parseErr) { throw new Error(`サーバーが正しいデータを返しませんでした（HTTP ${res.status}: ${text.replace(/<(style|script)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120)}）`); }
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('サーバーの応答がありません（タイムアウト）');
        throw e;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function fetchInit() {
      showLoader(true, "システム起動中...", "マスタデータを取得しています");
      try {
        const json = await fetchGasJson({ action: "fetch_init", password: PIN_CODE, app_name: "日報" });
        if (json.status === "success") {
          populateSelect('info-nurse', json.masters.ns || []);
          populateSelect('info-doctor', json.masters.dr || []);
          updateSyncTimestamp();
          await syncFromDb(false);
        } else { throw new Error(json.message); }
      } catch(e) {
        sendErrorLog(`Msg: ${e.message || e}\nStack: ${e.stack || e.toString()}`);
        alert(String(e.message || e).includes("タイムアウト") ? "サーバーからの応答がありません。時間をおいて再読込してください（起動直後は時間がかかる場合があります）。" : "初期通信エラーが発生しました。");
      } finally { showLoader(false); }
    }

    async function syncFromDb(force) {
      if (!force) { saveReportDraftNow(); reportDraftReady = false; } // 🌟 日付切替の前に、表示中の日付の下書きを保存しておく
      showLoader(true, "データを同期中...", "事案データベースからデータを取得しています");
      const dateVal = normalizeDate(document.getElementById('info-date').value);
      try {
        const res = await fetch(GAS_API_URL, { 
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ action: "fetch_daily_report", password: PIN_CODE, date: dateVal, force_sync: force }), 
          redirect: "follow" 
        });
        const json = await parseGasResponse(res);
        
        if (json.status === "success") {
          const data = json.data;
          if (force) {
            tempManualEvents = events.filter(e => !String(e.id).startsWith("auto-"));
            tempAutoEvents = (data.events || []).filter(e => String(e.id).startsWith("auto-"));
            
            let hasOverlap = false;
            for (let me of tempManualEvents) {
              const ms = timeToMins(me.start); const me_end = timeToMins(me.end);
              for (let ae of tempAutoEvents) { const as = timeToMins(ae.start); const ae_end = timeToMins(ae.end); if (ms < ae_end && me_end > as) { hasOverlap = true; break; } }
              if(hasOverlap) break;
            }
            if (hasOverlap) { document.getElementById('sync-modal').classList.remove('hidden'); showLoader(false); return; } 
            else { events = [...tempManualEvents, ...tempAutoEvents]; alert("事案データを取り込みました。"); }
          } else {
            const setIfNotSelected = (selId, othId, val) => { 
              const sel = document.getElementById(selId); 
              if (val) { 
                if ([...sel.options].some(o => o.value === val)) { sel.value = val; document.getElementById(othId).classList.add('hidden'); } 
                else { sel.value = 'その他'; document.getElementById(othId).value = val; document.getElementById(othId).classList.remove('hidden'); } 
              } else { sel.value = ""; document.getElementById(othId).classList.add('hidden'); }
            };
            setIfNotSelected('info-nurse', 'info-nurse-other', data.recorder); 
            setIfNotSelected('info-doctor', 'info-doctor-other', data.doctor);
            
            applyStandbyInfo(parseStandbyInfo(data.hamamachiReason));
            events = data.events || [];
          }
          updatePrintHeader();
          updateSyncTimestamp();
          render();
          if (!force) initReportDraft(); // 🌟 サーバーの日報を表示した後で、この日付の入力途中の下書きを確認
        } else { throw new Error(json.message); }
      } catch(e) {
        sendErrorLog(`Msg: ${e.message || e}\nStack: ${e.stack || e.toString()}`);
        alert("事案の同期に失敗しました。オフライン保存データを確認してください。");
        if (!force) initReportDraft(); // 🌟 電波がなくても、端末内の下書きの復元と保存は続ける
      } finally { showLoader(false); }
    }

    function resolveSync(choice) {
      document.getElementById('sync-modal').classList.add('hidden');
      if (choice === 'overwrite') { events = [...tempManualEvents, ...tempAutoEvents]; alert("事案を優先しました。重複部分は一覧から「削除」してください。"); render(); }
    }

    // ===== 🌟 入力途中の下書き自動保存（原則A3-C） =====
    // 日報は当直中に少しずつ書き足していくため、画面を閉じたり、iPhoneが裏で画面を破棄したりすると、未保存の追記が消えていた。
    // ===== 待機場所・待機理由・ブリーフィング等の入力欄 =====
    // 🌟 日報シート4列目（待機事由）に保存する。新形式は {"v":2,...} のJSON文字列。
    // 旧形式（「風向き,強風,その他の文」のカンマ区切り）は、内容をそのまま特記事項・引き継ぎ事項として読む。
    // 統括・業務管理（management.html）も同じ形式を読む。形式を変える時は両方を直すこと
    const STANDBY_REASONS = {
      "浜町待機": ["風向き", "天候不良", "強風", "機体トラブル"],
      "院内待機": ["風向き", "天候不良", "強風", "機体トラブル", "整備・点検"]
    };

    function getStandbyPlace() { const r = document.querySelector('input[name="standby-place"]:checked'); return r ? r.value : ""; }

    // 待機場所に合わせて待機理由の選択肢を出し直す（選択済みで新しい一覧にもある理由はチェックを残す）
    function renderReasonOptions(checkedList) {
      const place = getStandbyPlace();
      const list = STANDBY_REASONS[place] || [];
      const keep = checkedList || Array.from(document.querySelectorAll('input[name="reason"]:checked')).map(cb => cb.value);
      const box = document.getElementById('reason-options');
      box.innerHTML = "";
      list.forEach(val => {
        const lbl = document.createElement('label'); lbl.className = 'reason-pill';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.name = 'reason'; cb.value = val; cb.checked = keep.includes(val);
        cb.addEventListener('change', updatePrintHeader);
        const sp = document.createElement('span'); sp.textContent = val;
        lbl.appendChild(cb); lbl.appendChild(sp); box.appendChild(lbl);
      });
      document.getElementById('reason-box').classList.toggle('hidden', list.length === 0);
      document.getElementById('info-place-other').classList.toggle('hidden', place !== 'その他');
    }
    function onPlaceChange() {
      renderReasonOptions();
      if (getStandbyPlace() !== 'その他') document.getElementById('info-place-other').value = "";
      if (!STANDBY_REASONS[getStandbyPlace()]) document.getElementById('info-reason-other').value = "";
      updatePrintHeader();
    }

    // 画面の入力内容を1つのオブジェクトにまとめる
    function getStandbyInfo() {
      const place = getStandbyPlace();
      return {
        v: 2,
        place: place,
        placeOther: place === 'その他' ? document.getElementById('info-place-other').value.trim() : "",
        reasons: STANDBY_REASONS[place] ? Array.from(document.querySelectorAll('input[name="reason"]:checked')).map(cb => cb.value) : [],
        reasonOther: STANDBY_REASONS[place] ? document.getElementById('info-reason-other').value.trim() : "",
        briefing: document.getElementById('info-briefing').value.trim(),
        free: document.getElementById('info-free').value.trim(),
        handover: document.getElementById('info-remarks').value.trim(),
        reqCount: document.getElementById('info-req-count').value.trim(),
        respCount: document.getElementById('info-resp-count').value.trim(),
        endTime: document.getElementById('info-end-time').value.trim()
      };
    }
    // まとめたオブジェクトを画面へ戻す（null なら全部空にする）
    function applyStandbyInfo(info) {
      const d = info || {};
      document.querySelectorAll('input[name="standby-place"]').forEach(r => { r.checked = (r.value === d.place); });
      document.getElementById('info-place-other').value = d.placeOther || "";
      renderReasonOptions(d.reasons || []);
      document.getElementById('info-reason-other').value = d.reasonOther || "";
      document.getElementById('info-briefing').value = d.briefing || "";
      document.getElementById('info-free').value = d.free || "";
      document.getElementById('info-remarks').value = d.handover || "";
      document.getElementById('info-req-count').value = d.reqCount != null ? d.reqCount : "";
      document.getElementById('info-resp-count').value = d.respCount != null ? d.respCount : "";
      document.getElementById('info-end-time').value = d.endTime || "";
    }
    // 🌟 タイムラインから数える件数（要請＝ヘリ活動＋キャンセル、対応＝ヘリ活動）。業務管理の自動件数と同じ数え方
    function autoCaseCounts() {
      const m = events.filter(e => e.cat === 'mission').length; const c = events.filter(e => e.cat === 'cancel').length;
      return { req: m + c, resp: m };
    }
    // 🌟 16:30以降を時間外として「何時間何分」を返す（16:30以前・未入力は空）
    function overtimeText(endTime) {
      const p = String(endTime || "").split(':');
      if (p.length !== 2) return "";
      const over = parseInt(p[0], 10) * 60 + parseInt(p[1], 10) - (16 * 60 + 30);
      if (!(over > 0)) return "時間外なし";
      return `時間外 ${Math.floor(over / 60)}時間${over % 60}分`;
    }
    // シートの値（新形式JSON／旧形式カンマ区切り）を読み取る
    function parseStandbyInfo(raw) {
      const str = String(raw || "").trim();
      if (!str) return null;
      if (str.charAt(0) === "{") {
        try { const o = JSON.parse(str); if (o && o.v === 2) return o; } catch (e) { /* 旧形式として読む */ }
      }
      // 旧形式には待機場所の区別が無いため、場所は推測せず、内容をそのまま特記事項に入れる（文字は失わない）
      return { v: 2, place: "", placeOther: "", reasons: [], reasonOther: "", briefing: "", free: "", handover: str.split(',').map(r => r.trim()).filter(Boolean).join(", ") };
    }
    // 印刷・一覧用の短い表記（例：浜町待機（風向き・強風））
    function standbySummary(info) {
      if (!info || !info.place) return "";
      const placeLabel = info.place === 'その他' ? (info.placeOther ? `その他：${info.placeOther}` : 'その他') : info.place;
      const rs = (info.reasons || []).concat(info.reasonOther ? [info.reasonOther] : []);
      return rs.length ? `${placeLabel}（${rs.join('・')}）` : placeLabel;
    }

    // 日付ごと（aw109_draft_report_<日付>）に、記載者・医師・待機場所・待機理由・ブリーフィング等・タイムラインを端末内(localStorage)へ自動保存する。
    const REPORT_DRAFT_PREFIX = "aw109_draft_report_";
    const REPORT_DRAFT_MAX_AGE_MS = 72 * 60 * 60 * 1000;
    let reportDraftReady = false; let reportDraftBaseline = ""; let reportDraftTimer = null;
    let reportDraftDate = ""; // 下書きの保存先の日付（日付欄を切り替えた瞬間に、別の日付へ保存してしまわないよう固定する）

    function getReportSnapshot() {
      return {
        nurse: document.getElementById('info-nurse').value, nurseOther: document.getElementById('info-nurse-other').value,
        doctor: document.getElementById('info-doctor').value, doctorOther: document.getElementById('info-doctor-other').value,
        standby: getStandbyInfo(),
        events: events
      };
    }
    function reportCompareString(snap) { return JSON.stringify([snap.nurse, snap.nurseOther, snap.doctor, snap.doctorOther, snap.standby, snap.events]); }

    function saveReportDraftNow() {
      if (!reportDraftReady || !reportDraftDate) return;
      clearTimeout(reportDraftTimer);
      try {
        const snap = getReportSnapshot();
        if (reportCompareString(snap) === reportDraftBaseline) return;
        snap.savedAt = Date.now();
        localStorage.setItem(REPORT_DRAFT_PREFIX + reportDraftDate, JSON.stringify(snap));
      } catch (e) { console.warn("下書き保存に失敗しました:", e); }
    }
    function scheduleReportDraftSave() {
      if (!reportDraftReady) return;
      clearTimeout(reportDraftTimer);
      reportDraftTimer = setTimeout(saveReportDraftNow, 800);
    }
    function clearReportDraft() {
      clearTimeout(reportDraftTimer);
      try { localStorage.removeItem(REPORT_DRAFT_PREFIX + reportDraftDate); } catch (e) {}
      reportDraftBaseline = reportCompareString(getReportSnapshot()); // 保存した状態から変わった時だけ、また下書きにする
    }

    function applyReportDraft(d) {
      const setSel = (selId, othId, val, other) => {
        const sel = document.getElementById(selId);
        sel.value = val || "";
        document.getElementById(othId).value = other || "";
        document.getElementById(othId).classList.toggle('hidden', val !== 'その他');
      };
      setSel('info-nurse', 'info-nurse-other', d.nurse, d.nurseOther);
      setSel('info-doctor', 'info-doctor-other', d.doctor, d.doctorOther);
      // 旧形式の下書き（reasons/remarks）も読めるようにする
      applyStandbyInfo(d.standby || parseStandbyInfo([].concat(d.reasons || [], d.remarks ? [d.remarks] : []).join(',')));
      events = Array.isArray(d.events) ? d.events : [];
      updatePrintHeader(); render();
    }

    // 日付ごとの表示が終わった時に呼ぶ。下書きがサーバーの内容と違えば復元を確認し、その後の状態を比較の基準にする
    function initReportDraft() {
      reportDraftDate = normalizeDate(document.getElementById('info-date').value);
      const key = REPORT_DRAFT_PREFIX + reportDraftDate;
      let d = null;
      try { d = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { d = null; }
      if (d && (!d.savedAt || Date.now() - d.savedAt > REPORT_DRAFT_MAX_AGE_MS)) { try { localStorage.removeItem(key); } catch (e) {} d = null; }
      const current = reportCompareString(getReportSnapshot());
      let restored = false;
      if (d && reportCompareString(d) !== current) {
        const t = new Date(d.savedAt);
        const when = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
        if (confirm(`${reportDraftDate} の日報に、まだ保存していない入力途中の下書きがあります（${when}）。\n\n［OK］下書きを復元する\n［キャンセル］下書きを破棄する`)) {
          applyReportDraft(d); restored = true;
        } else {
          try { localStorage.removeItem(key); } catch (e) {}
        }
      } else if (d) {
        try { localStorage.removeItem(key); } catch (e) {} // サーバーの内容と同じ＝保存済みなので不要
      }
      reportDraftBaseline = restored ? "" : reportCompareString(getReportSnapshot());
      reportDraftReady = true;
      if (restored) saveReportDraftNow();
    }

    ["input", "change", "click"].forEach(evt => document.addEventListener(evt, () => scheduleReportDraftSave(), true));
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveReportDraftNow(); });
    window.addEventListener("pagehide", saveReportDraftNow);

    async function saveReport() {
      const dateVal = normalizeDate(document.getElementById('info-date').value);
      const nsVal = document.getElementById('info-nurse').value === 'その他' ? document.getElementById('info-nurse-other').value : document.getElementById('info-nurse').value;
      const drVal = document.getElementById('info-doctor').value === 'その他' ? document.getElementById('info-doctor-other').value : document.getElementById('info-doctor').value;
      if (!nsVal || !drVal) return alert("記載者とフライトドクターを選択・入力してください。");
      const standby = getStandbyInfo();
      if (standby.place === 'その他' && !standby.placeOther) return alert("待機場所「その他」の場所を入力してください。");
      
      showLoader(true, "保存中...", "日誌データを更新しています");
      try {
        const res = await fetch(GAS_API_URL, { 
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify({ action: "save_daily_report", password: PIN_CODE, date: dateVal, recorder: nsVal, doctor: drVal, hamamachiReason: JSON.stringify(standby), events: events }), 
          redirect: "follow" 
        });
        const json = await parseGasResponse(res); 
        if (json.status === "success") {
          clearReportDraft(); // 🌟 保存できたので下書きは不要
          alert("保存しました！");
          updateSyncTimestamp();
        } else { throw new Error(json.message); }
      } catch(e) {
        saveReportDraftNow();
        const m = String(e.message || e);
        if ((e && e.isTimeout) || m.includes("Load failed") || m.includes("Failed to fetch") || m.includes("NetworkError") || m.includes("network connection was lost")) {
          // 🌟 電波切れはアプリの不具合ではないため、エラー報告は送らず案内だけ出す（原則A4）
          alert("電波が弱いため保存できませんでした。\n入力内容は画面と端末内の下書きに残っています。\n電波の良い場所で、もう一度「日報を確定・保存」を押してください。");
        } else {
          sendErrorLog(`Msg: ${e.message || e}\nStack: ${e.stack || e.toString()}`);
          alert("保存エラーが発生しました。入力内容は画面と端末内の下書きに残っています。");
        }
      } finally { showLoader(false); }
    }

    function updatePrintHeader() {
      document.getElementById('print-date').innerText = normalizeDate(document.getElementById('info-date').value);
      const ns = document.getElementById('info-nurse').value; document.getElementById('print-ns').innerText = ns === 'その他' ? document.getElementById('info-nurse-other').value : ns || "未入力";
      const dr = document.getElementById('info-doctor').value; document.getElementById('print-dr').innerText = dr === 'その他' ? document.getElementById('info-doctor-other').value : dr || "未入力";
      const info = getStandbyInfo();
      document.getElementById('print-reason').innerText = standbySummary(info) || '未入力';
      const ac = autoCaseCounts();
      document.getElementById('info-req-count').placeholder = `自動 ${ac.req}`;
      document.getElementById('info-resp-count').placeholder = `自動 ${ac.resp}`;
      const ot = overtimeText(info.endTime);
      document.getElementById('info-overtime').innerText = ot;
      document.getElementById('print-counts').innerText = `要請 ${info.reqCount !== "" ? info.reqCount : ac.req}件 / 対応 ${info.respCount !== "" ? info.respCount : ac.resp}件` + (info.endTime ? ` / 終了 ${info.endTime}（${ot}）` : "");
      [["briefing", info.briefing], ["free", info.free], ["handover", info.handover]].forEach(([k, v]) => {
        document.getElementById('print-' + k).innerText = v;
        document.getElementById('print-' + k + '-box').classList.toggle('hidden', !v);
      });
    }
    
    function populateSelect(id, array) { const sel = document.getElementById(id); sel.innerHTML = `<option value="">-- 選択 --</option>`; array.forEach(name => sel.innerHTML += `<option value="${name}">${name}</option>`); sel.innerHTML += `<option value="その他">その他(手入力)</option>`; }
    function toggleCustomInput(sId, iId) { const sel = document.getElementById(sId); const inp = document.getElementById(iId); if (sel.value === 'その他') { inp.classList.remove('hidden'); inp.focus(); } else { inp.classList.add('hidden'); inp.value = ''; } updatePrintHeader(); }
    
    // 🌟 待機終了は17:30か「日没1時間前」の「早い方」を完全厳密計算
    function calculateSun() {
      const dateStr = normalizeDate(document.getElementById('info-date').value); updatePrintHeader();
      if (!dateStr || typeof SunCalc === 'undefined') return;
      
      // 🌟 SunCalcはDateのUTC日付を基準に計算するため、現地(JST)の午前0時をそのまま渡すと
      // UTC変換で前日に繰り下がり、日没が丸1日ズレる不具合があった（2026-08-15発見）。
      // 正午を渡すことでJST-UTC(+9h)のズレがあっても暦日を跨がないようにする
      const [dy, dm, dd] = dateStr.split(/[-/]/).map(Number);
      const date = new Date(dy, dm - 1, dd, 12, 0, 0);
      const times = SunCalc.getTimes(date, 31.5602, 130.558); // 鹿児島浜町
      const fmt = d => d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      
      const limit1730 = new Date(date); 
      limit1730.setHours(17, 30, 0, 0); 
      
      const sunsetMinus1Hr = new Date(times.sunset.getTime() - 60 * 60 * 1000); 
      
      // 早い方を算出 (Math.minを使用)
      const standbyTime = new Date(Math.min(limit1730.getTime(), sunsetMinus1Hr.getTime()));
      
      document.getElementById('sun-display').innerHTML = `<span style="white-space:nowrap;">🌅 日出:${fmt(times.sunrise)}</span><span style="white-space:nowrap;">🌇 日没:${fmt(times.sunset)}</span><span class="font-bold border-l border-amber-200 pl-3 ml-1 text-amber-900" style="white-space:nowrap;">⏱️ 待機終了:${fmt(standbyTime)}</span>`;
    }

    function drawGrid() {
      const grid = document.getElementById('chart-grid'); let html = '';
      for (let i = 0; i <= (END_HOUR - START_HOUR); i++) {
        const left = (i / (END_HOUR - START_HOUR)) * 100;
        html += `<div class="absolute -translate-x-1/2 -top-6 text-xs font-bold text-slate-400" style="left: ${left}%;">${START_HOUR + i}:00</div><div class="absolute top-0 bottom-0 w-px bg-slate-200 -translate-x-1/2" style="left: ${left}%;"></div>`;
        if (i < END_HOUR - START_HOUR) html += `<div class="absolute top-0 bottom-0 w-px border-l border-slate-300 border-dashed opacity-50 -translate-x-1/2" style="left: ${left + (50 / (END_HOUR - START_HOUR))}%;"></div>`;
      }
      grid.innerHTML = html;
    }

    function drawLegend() {
      const box = document.getElementById('legend-box'); let html = '';
      for(let k in CATS) html += `<span class="flex items-center gap-1"><div class="w-3 h-3 rounded-full ${CATS[k].color}"></div>${CATS[k].label}</span>`;
      box.innerHTML = html + `<span class="flex items-center gap-1 border-l border-slate-300 pl-3"><div class="w-3 h-3 bg-yellow-300 opacity-60"></div>準備</span><span class="flex items-center gap-1"><div class="w-3 h-3 bg-green-100 border border-green-300"></div>復帰</span>`;
    }

    function timeToMins(t) { if(!t) return 0; const [h, m] = t.split(':').map(Number); return (h - START_HOUR) * 60 + m; }

    function render() {
      events.sort((a, b) => timeToMins(a.start) - timeToMins(b.start));
      const bars = document.getElementById('chart-bars'); const tbody = document.getElementById('list-body');
      let barsHtml = ''; let listHtml = '';

      events.forEach((ev, idx) => {
        const s = timeToMins(ev.start); const e = timeToMins(ev.end); const dur = e - s; const cat = CATS[ev.cat] || CATS['other'];
        let prep = cat.prep; if (idx > 0 && events[idx-1].cont) prep = 0; 
        let rec = 0; if (!ev.cont) { if (cat.rec === 'auto') rec = (dur < 60) ? 30 : 45; else rec = cat.rec; }

        const getPct = (mins) => (mins / TOTAL_MINUTES) * 100;
        const pLeft = getPct(s - prep); const pWidth = getPct(prep); const mLeft = getPct(s); const mWidth = getPct(dur); const rLeft = getPct(e); const rWidth = getPct(rec);

        barsHtml += `<div class="absolute h-full w-full top-0">`;
        if (prep > 0) barsHtml += `<div class="absolute top-1/2 -translate-y-1/2 h-10 bg-yellow-300 opacity-60 rounded-l-md border-y border-l border-yellow-500" style="left: ${pLeft}%; width: ${pWidth}%;"></div>`;
        barsHtml += `<div class="absolute top-1/2 -translate-y-1/2 h-14 ${cat.color} rounded-md shadow flex items-center justify-center text-white text-[10px] font-bold border-b-4 border-black/20" style="left: ${mLeft}%; width: ${mWidth}%;"><span class="truncate px-1">${ev.no ? '#'+ev.no : cat.label}</span></div>`;
        if (rec > 0) barsHtml += `<div class="absolute top-1/2 -translate-y-1/2 h-10 bg-green-100 opacity-80 rounded-r-md border-y border-r border-green-300 text-[9px] text-green-800 font-bold flex items-center justify-center" style="left: ${rLeft}%; width: ${rWidth}%;">${rec}m</div>`;
        barsHtml += `</div>`;

        listHtml += `
          <tr class="hover:bg-slate-50 border-b border-slate-100 ${editingId === ev.id ? 'bg-amber-50' : ''}">
            <td class="px-4 py-2"><span class="px-2 py-1 rounded text-xs font-bold text-white ${cat.color}">${cat.label}</span></td>
            <td class="px-4 py-2 font-mono text-center">${ev.no || '-'}</td>
            <td class="px-4 py-2 font-mono text-center">${ev.start} - ${ev.end}</td>
            <td class="px-4 py-2 font-mono text-center">${dur}m</td>
            <td class="px-4 py-2 truncate max-w-[200px]">${ev.desc}</td>
            <td class="px-4 py-2 text-center no-print">
              <button type="button" onclick="editEvent('${ev.id}')" class="text-blue-600 font-bold text-xs bg-blue-50 px-2 py-1 rounded mr-1">修正</button>
              <button type="button" onclick="deleteEvent('${ev.id}')" class="text-red-600 font-bold text-xs bg-red-50 px-2 py-1 rounded">削除</button>
            </td>
          </tr>
        `;
      });
      bars.innerHTML = barsHtml; tbody.innerHTML = listHtml;
      updatePrintHeader(); // 🌟 自動件数（要請・対応の目安）をタイムラインに合わせて更新
      scheduleReportDraftSave(); // 🌟 タイムラインの追加・修正・削除も下書きに反映する
    }

    function saveEvent() {
      const cat = document.getElementById('event-cat').value; 
      const no = document.getElementById('event-no').value.trim(); 
      const start = document.getElementById('event-start').value; 
      const end = document.getElementById('event-end').value; 
      const desc = document.getElementById('event-desc').value.trim(); 
      const cont = document.getElementById('event-continuous').checked;
      
      if (!start || !end) return alert("時間を入力してください。"); 
      if (timeToMins(start) >= timeToMins(end)) return alert("終了時間が不正です。");
      
      const newEv = { id: editingId ? editingId : Date.now().toString(), cat, no, start, end, desc, cont };
      if (editingId) events = events.map(e => e.id === editingId ? newEv : e); else events.push(newEv);
      cancelEdit(); render();
    }

    function editEvent(id) {
      const ev = events.find(e => e.id === id); if (!ev) return; editingId = id;
      document.getElementById('event-cat').value = ev.cat; document.getElementById('event-no').value = ev.no; document.getElementById('event-start').value = ev.start; document.getElementById('event-end').value = ev.end; document.getElementById('event-desc').value = ev.desc; document.getElementById('event-continuous').checked = ev.cont;
      document.getElementById('entry-form-container').classList.replace('bg-blue-50', 'bg-amber-50'); document.getElementById('form-title').innerText = "✏️ 修正"; document.getElementById('btn-cancel-edit').classList.remove('hidden'); document.getElementById('btn-save').innerText = "更新する"; document.getElementById('btn-save').style.backgroundColor = "#f59e0b"; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); 
    }

    function cancelEdit() {
      editingId = null; document.getElementById('event-no').value = ''; document.getElementById('event-start').value = ''; document.getElementById('event-end').value = ''; document.getElementById('event-desc').value = ''; document.getElementById('event-continuous').checked = false;
      document.getElementById('entry-form-container').classList.replace('bg-amber-50', 'bg-blue-50'); document.getElementById('form-title').innerText = "➕ 追加"; document.getElementById('btn-cancel-edit').classList.add('hidden'); document.getElementById('btn-save').innerText = "追加する"; document.getElementById('btn-save').style.backgroundColor = "var(--blue)"; render();
    }

    function deleteEvent(id) { if(confirm("本当にこの記録を削除しますか？\n（この操作は取り消せません）")) { events = events.filter(e => e.id !== id); if (editingId === id) cancelEdit(); render(); } }
    function resetAll() { if(confirm("画面上の入力内容をすべてリセットしますか？")) { events = []; document.getElementById('info-nurse').value = ''; document.getElementById('info-doctor').value = ''; applyStandbyInfo(null); cancelEdit(); updatePrintHeader(); render(); } }
  </script>
</body>
